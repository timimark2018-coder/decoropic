# 每次 Vercel 生产部署成功后，把 sitemap 里 lastmod 有变化的 URL 推给 IndexNow。
# 上一次的 lastmod 快照存在 Actions 缓存里(每次运行存一份新的，恢复时取最近一份)。
name: IndexNow

on: deployment_status

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  push:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore last sitemap snapshot
        uses: actions/cache@v4
        with:
          path: .indexnow
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-
      - name: Push changed URLs
        run: |
          mkdir -p .indexnow
          sleep 20  # 等生产别名切到新部署
          node scripts/indexnow.mjs --changed .indexnow/state.json
